{% if form.non_field_errors and not form.clashes %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
